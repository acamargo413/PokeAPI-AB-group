
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pokémon Explorer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    /* BUSCADOR */

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #search {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #typeFilter {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* RESULTADOS */

    #results {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .pokemon-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .pokemon-card img {
      width: 130px;
      height: 130px;
      object-fit: contain;
    }

    .pokemon-card h3 {
      margin: 10px 0;
      text-transform: capitalize;
    }

    .pokemon-card button {
      margin-top: 10px;
    }

    /* PAGINACIÓN */

    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      flex-wrap: wrap;
    }

    /* DETALLES */

    #details {
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .pokemon-details {
      text-align: center;
    }

    .pokemon-details img {
      max-width: 200px;
      width: 100%;
    }

    .pokemon-details ul {
      max-width: 400px;
      margin: auto;
      padding: 0;
      list-style: none;
    }

    .pokemon-details li {
      padding: 8px;
      margin-bottom: 5px;
      background: #f1f1f1;
      border-radius: 6px;
    }

    .pokemon-details h3 {
      margin-top: 25px;
    }

    /* FAVORITOS */

    .favorite-button {
      margin-top: 15px;
      background: #e63946;
    }

    #favoriteMessage {
      margin-top: 15px;
    }

    #favoriteMessage select {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    /* COLECCIONES */

    .collections-section {
      margin-top: 30px;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .collections-section h2 {
      margin-top: 0;
    }

    .collection-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #collectionName {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .collection-card {
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .collection-card h3 {
      margin-top: 0;
      text-transform: capitalize;
    }

    .collection-card button {
      margin-right: 8px;
      margin-bottom: 10px;
    }

    .delete-collection-button {
      background: #b00020;
    }

    .favorite-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-top: 8px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .favorite-item span {
      text-transform: capitalize;
    }

    .delete-favorite-button {
      background: #dc3545;
    }

    /* RESPONSIVE */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .search-container {
        flex-direction: column;
      }

      #search,
      #typeFilter,
      .search-container button {
        width: 100%;
      }

      #results {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .pokemon-card {
        padding: 10px;
      }

      .pokemon-card img {
        width: 100px;
        height: 100px;
      }

      #details {
        padding: 15px;
      }

      .collection-form {
        flex-direction: column;
      }

      #collectionName {
        width: 100%;
      }

      .favorite-item {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .favorite-item button {
        width: 100%;
      }
    }

    @media (min-width: 601px)
      and (max-width: 900px) {

      #results {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>
      Pokémon Explorer
    </h1>

    <!-- BUSCADOR -->

    <div class="search-container">

      <input
        type="text"
        id="search"
        placeholder="Buscar Pokémon..."
        autocomplete="off"
      >

      <select id="typeFilter">

        <option value="">
          Todos los tipos
        </option>

        <option value="normal">
          Normal
        </option>

        <option value="fire">
          Fire
        </option>

        <option value="water">
          Water
        </option>

        <option value="electric">
          Electric
        </option>

        <option value="grass">
          Grass
        </option>

        <option value="ice">
          Ice
        </option>

        <option value="fighting">
          Fighting
        </option>

        <option value="poison">
          Poison
        </option>

        <option value="ground">
          Ground
        </option>

        <option value="flying">
          Flying
        </option>

        <option value="psychic">
          Psychic
        </option>

        <option value="bug">
          Bug
        </option>

        <option value="rock">
          Rock
        </option>

        <option value="ghost">
          Ghost
        </option>

        <option value="dragon">
          Dragon
        </option>

        <option value="dark">
          Dark
        </option>

        <option value="steel">
          Steel
        </option>

        <option value="fairy">
          Fairy
        </option>

      </select>

      <button id="searchButton">
        Buscar
      </button>

    </div>

    <!-- RESULTADOS -->

    <div id="results">

      <p>
        Cargando Pokémon...
      </p>

    </div>

    <!-- PAGINACIÓN -->

    <div id="pagination"></div>

    <!-- DETALLES -->

    <div id="details"></div>

    <!-- COLECCIONES -->

    <section class="collections-section">

      <h2>
        Mis colecciones
      </h2>

      <div class="collection-form">

        <input
          type="text"
          id="collectionName"
          placeholder="Nombre de la colección..."
        >

        <button id="createCollectionButton">
          Crear colección
        </button>

      </div>

      <div id="collections">

        <p>
          Cargando colecciones...
        </p>

      </div>

    </section>

  </div>

  <!-- TypeScript compilado -->

  <script
    type="module"
    src="./dist/components/main.js"
  ></script>

</body>
</html>
